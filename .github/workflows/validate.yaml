name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: marketplace validate
    runs-on: "ubuntu-latest"
    steps:
      - name: Marketplace Action
        uses: "hacs/action@main"
        with:
          category: "integration"
  hassfest:
    name: hassfest validate
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v4"
        - uses: "home-assistant/actions/hassfest@master"

      - name: Check Quality Scale
        run: |
          if [ -f script/check_quality_scale.py ]; then
            pip install probatio packaging
            python script/check_quality_scale.py
          fi
